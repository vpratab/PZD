[package]
name = "pzdr-enclave"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "PZDR enclave-side binary. Runs INSIDE the Nitro Enclave. Listens on vsock, decrypts channel ciphertext, processes inference, signs deletion proofs, returns receipts."

[[bin]]
name = "pzdr-enclave"
path = "src/main.rs"

[dependencies]
# vsock + tokio
tokio = { version = "1", features = ["full"] }
tokio-vsock = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
base64 = "0.22"
hex = "0.4"
bytes = "1"

# crypto
sha2 = "0.10"
hkdf = "0.12"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
chacha20poly1305 = { version = "0.10", features = ["std"] }
rand = "0.8"
zeroize = { version = "1", features = ["zeroize_derive"] }

# Real Nitro attestation
nitro-attestation = { path = "../../crates/nitro-attestation", features = ["inside-enclave"] }
