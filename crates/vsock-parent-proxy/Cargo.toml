[package]
name = "vsock-parent-proxy"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "PZDR Gateway parent-partition HTTP↔vsock proxy. Runs on the EC2 instance, accepts HTTPS from the ALB, forwards into the Nitro Enclave over vsock."

[[bin]]
name = "vsock-parent-proxy"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tokio-vsock = "0.5"
tower = "0.5"
tower-http = { version = "0.5", features = ["trace", "timeout"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy"] }
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
bytes = "1"
prometheus = "0.13"
base64 = "0.22"
